<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">What Soccer Team Should You Support?</h1>
    
    <!-- Start quiz element -->
    <div class="container d-flex justify-content-center" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">What matters most to you in a soccer team?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Paris Saint-Germain">Controlled, dominant, and direct attacking</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="FC Barcelona">Skillful and aggressive possession-based attacking</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Manchester United">Dominant historical success, but modern-day underachievers</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Real Madrid">Winning trophies and expecting to be the best</button>
          </div>
        </div>
      </div>
    </div>

    
    <div class="container d-flex justify-content-center" id="question-2">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3"></h4>What do you value most in a soccer club?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Paris Saint-Germain">Ambition, entertainment, and modern success</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="FC Barcelona">Unique playing style and development of young players</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Manchester United">Tradition, loyalty, and a massive fanbase</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Real Madrid">A winning culture and continental greatness across Europe</button>
          </div>
        </div>
      </div>
    </div>


    <div class="container d-flex justify-content-center" id="question-3">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">What kind of football experience do you prefer?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Paris Saint-Germain">A modern, star-filled team that plays exciting football</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="FC Barcelona">Technical football built around passing and teamwork</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Manchester United">The excitement of supporting a historic club through ups and downs</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Real Madrid">A club that thrives under pressure and wins on the biggest stage</button>
      </div>
    </div>
  </div>
</div>


<div class="container d-flex justify-content-center" id="question-4">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">What would make you most proud to support a club?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Paris Saint-Germain">Being part of a club building a global football powerhouse</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="FC Barcelona">Supporting a club with a clear identity and loyal supporters</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Manchester United">Standing by my club through every high and low</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="Real Madrid">Supporting a club known for winning major trophies</button>
      </div>
    </div>
  </div>
</div>
    <!-- End quiz element -->

    <!-- Add more quiz elements here -->



    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
